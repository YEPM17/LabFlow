<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>福大 LabFlow · 教师工作台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="teacher-body">
  <aside class="sidebar">
    <a class="sidebar-logo" href="index.html"><span class="brand-seal">LF</span> LabFlow</a>
    <p>福州大学实验室管理体验版</p>
    <button onclick="showTeacherPage('overview')">
      总览
    </button>
    <button onclick="showTeacherPage('bookings')">
      预约审核
    </button>
    <button onclick="showTeacherPage('repairs')">
      报修管理
    </button>
    <button onclick="showTeacherPage('equipment')">
      设备管理
    </button>
    <button onclick="logout()">退出登录</button>
  </aside>
  <main class="teacher-main">
    <header class="teacher-header">
      <div class="teacher-header-top">
        <div>
          <div class="eyebrow dark">实验室管理工作台</div>
          <h1>设备、预约与维修，一处掌握</h1>
          <p>欢迎，<span id="teacherName"></span> · <span id="teacherRoleLabel">实验室管理员</span> · 数据实时保存于实验室服务器</p>
        </div>
        <div id="notificationMount" class="notification-mount"></div>
      </div>
    </header>
    <!-- 数据总览 -->
    <section id="overview" class="teacher-section">
      <h2>数据概览</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span>设备总数</span>
          <strong id="totalDevices">0</strong>
        </div>
        <div class="stat-card">
          <span>待审核预约</span>
          <strong id="pendingBookings">0</strong>
        </div>
        <div class="stat-card">
          <span>待处理报修</span>
          <strong id="pendingRepairs">0</strong>
        </div>
        <div class="stat-card">
          <span>已通过预约</span>
          <strong id="approvedBookings">0</strong>
        </div>
      </div>
      <div class="panel">
        <h3>预约申请审核结果统计</h3>
        <div id="usageChart"></div>
      </div>
      <div class="panel weekly-panel">
        <h3>近 7 天使用情况</h3>
        <div class="weekly-kpis">
          <div><span>预约总量</span><strong id="weeklyReservations">0</strong></div>
          <div><span>已批准时长</span><strong id="weeklyHours">0h</strong></div>
          <div><span>设备利用率</span><strong id="weeklyUtilization">0%</strong></div>
        </div>
        <p id="peakHours" class="hint">高峰时段：暂无数据</p>
        <div id="weeklyChart" class="weekly-chart"></div>
      </div>
    </section>
    <!-- 预约审核 -->
    <section id="bookings" class="teacher-section hidden">
      <h2>预约审核</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>学生</th>
              <th>设备</th>
              <th>日期</th>
              <th>时间</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="bookingTable"></tbody>
        </table>
      </div>
    </section>
    <!-- 报修管理 -->
    <section id="repairs" class="teacher-section hidden">
      <h2>设备报修管理</h2>
      <div id="teacherRepairList"></div>
    </section>
    <!-- 设备管理 -->
    <section id="equipment" class="teacher-section hidden">
      <div class="section-heading">
        <h2>实验室设备管理</h2>
        <button class="primary-btn" onclick="toggleAddDevice()">
          ＋ 新增设备
        </button>
      </div>
      <div id="addDeviceForm" class="panel hidden">
        <h3 id="deviceFormTitle">新增设备</h3>
        <input type="hidden" id="editingDeviceId">
        <label for="newDeviceName">设备名称</label>
        <input id="newDeviceName" placeholder="如：数字示波器">
        <label for="newDeviceRoom">所在实验室</label>
        <input id="newDeviceRoom" placeholder="如：实验楼 A201">
        <label for="newDeviceType">设备类型</label>
        <input id="newDeviceType" maxlength="40" list="deviceTypeOptions" placeholder="如：电子测量">
        <datalist id="deviceTypeOptions">
          <option value="电子测量"></option><option value="电源设备"></option><option value="信号源"></option><option value="焊接设备"></option><option value="其他"></option>
        </datalist>
        <label for="newDeviceDesc">设备描述</label>
        <textarea id="newDeviceDesc" rows="3"
                  placeholder="设备用途说明"></textarea>
        <button id="deviceSaveButton" class="primary-btn" onclick="addDevice()">
          保存设备
        </button>
        <button class="outline-btn" onclick="closeDeviceForm()">取消</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>设备编号</th>
              <th>设备名称</th>
              <th>实验室</th>
              <th>类型</th>
              <th>状态</th>
              <th>管理操作</th>
            </tr>
          </thead>
          <tbody id="equipmentTable"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
