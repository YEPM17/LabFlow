<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>福大 LabFlow · 学生工作台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="student-body">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-seal">LF</span><span>LabFlow<small>实验设备预约体验版</small></span></a>
    <div class="topbar-right"><span class="topbar-context">学生工作台 / <b id="topStudentName"></b></span><div id="notificationMount" class="notification-mount"></div><button class="outline-btn" onclick="logout()">退出登录</button></div>
  </header>
  <main class="student-container">
    <section class="hero">
      <div><span class="hero-context-small">福州大学实验室管理体验版</span><h1>你好，<span id="studentName"></span>。</h1><p>今天想从哪台设备开始？</p><span class="hero-note">实验室服务器 · 预约与报修数据实时保存</span></div>
      <div class="student-hero-stats"><div><strong id="studentAvailable">0</strong><span>当前可用设备</span></div><div><strong id="studentPending">0</strong><span>我的待审核</span></div></div>
    </section>
    <nav class="student-nav" aria-label="学生工作台导航">
      <button onclick="showSection('devices')">设备目录</button><button onclick="showSection('myBookings')">我的预约</button><button onclick="showSection('myRepairs')">报修进度</button>
    </nav>
    <!-- 设备列表 -->
    <section id="devices" class="page-section">
      <div class="section-heading">
        <div><div class="eyebrow dark">EQUIPMENT DIRECTORY</div><h2>查找实验设备</h2><p class="section-subtitle">按设备名称或实验室位置快速定位</p></div>
        <button class="outline-btn" onclick="scanCode()">
          # 按编号查询
        </button>
      </div>
      <div class="filter-row">
        <label for="searchInput" class="sr-only">搜索设备名称或实验室</label>
        <input id="searchInput" type="search"
               placeholder="搜索设备名称、实验室或类型..."
               oninput="scheduleDeviceSearch()">
        <label class="sr-only" for="statusFilter">按设备状态筛选</label>
        <select id="statusFilter" onchange="renderDevices()"><option value="all">全部状态</option><option value="available">空闲</option><option value="reserved">使用中</option><option value="maintenance">维修中</option></select>
        <label class="sr-only" for="roomFilter">按实验室筛选</label>
        <select id="roomFilter" onchange="renderDevices()"><option value="">全部实验室</option></select>
        <label class="sr-only" for="typeFilter">按设备类型筛选</label>
        <select id="typeFilter" onchange="renderDevices()"><option value="">全部类型</option></select>
        <button type="button" class="filter-reset" onclick="clearDeviceFilters()">重置</button>
      </div>
      <p id="deviceResultCount" class="result-count" aria-live="polite"></p>
      <div id="deviceList" class="device-grid"></div>
    </section>
    <!-- 设备详情和预约 -->
    <section id="detail" class="page-section hidden">
      <button class="back-btn" onclick="showSection('devices')">
        ← 返回设备列表
      </button>
      <div class="panel">
        <h2 id="detailName"></h2>
        <p id="detailRoom"></p>
        <p id="detailType" class="detail-meta"></p>
        <p id="detailDescription"></p>
        <p>当前状态：<strong id="detailStatus"></strong></p>
        <h3>预约设备</h3>
        <label for="bookDate">使用日期</label>
        <input type="date" id="bookDate"
               onchange="renderSlots()">
        <p class="hint booking-rules">实验室开放时间 08:00–22:00；单次预约 0.5–4 小时，按 30 分钟选择。</p>
        <label for="bookStart">开始时间</label>
        <select id="bookStart" onchange="renderSlots()">
          <option value="08:00">08:00</option>
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
        </select>
        <label for="bookEnd">结束时间</label>
        <select id="bookEnd" onchange="renderSlots()">
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="12:00">12:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
          <option value="18:00">18:00</option>
        </select>
        <p id="slotMessage" class="hint"></p>
        <button class="primary-btn" onclick="submitBooking()">
          提交预约申请
        </button>
        <hr>
        <h3>发现设备故障？</h3>
        <label for="repairTitle">故障标题</label>
        <input id="repairTitle" maxlength="100" placeholder="如：示波器无法开机">
        <label for="repairDescription">故障描述</label>
        <textarea id="repairDescription" rows="4"
                  placeholder="请描述设备故障情况"></textarea>
        <label for="repairPhotos">故障照片（可选，最多 3 张，每张不超过 2MB）</label>
        <input type="file" id="repairPhotos" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
        <button class="outline-btn" onclick="submitRepair()">
          提交报修
        </button>
      </div>
    </section>
    <!-- 我的预约 -->
    <section id="myBookings" class="page-section hidden">
      <h2>我的预约</h2>
      <div id="bookingList"></div>
    </section>
    <!-- 我的报修 -->
    <section id="myRepairs" class="page-section hidden">
      <h2>我的报修</h2>
      <div id="repairList"></div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="student.js"></script>
</body>
</html>
